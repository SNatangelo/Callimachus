name: Desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: desktop-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select-platforms:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select affected desktop platforms
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python packaging/select_desktop_matrix.py

  build:
    name: ${{ matrix.platform }}
    needs: select-platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
      - name: Install Linux Qt platform libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libfreetype6 libgtk-3-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Install runtime and build dependencies on the runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt -r requirements-gui.txt -r requirements-ocr.txt -r requirements-rag.txt -c packaging/release-constraints.txt
          python -m pip install --only-binary=:all: pyinstaller==6.22.3 pytest -c packaging/release-constraints.txt
      - name: Test package contracts and desktop paths
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || '' }}
          PYTHONUTF8: "1"
        run: >-
          python -m pytest
          tests/test_desktop_build.py
          tests/test_desktop_licenses.py
          tests/test_desktop_matrix.py
          tests/test_windows_installer_build.py
          tests/test_packaged_runtime.py
          tests/test_invocation.py
          tests/test_cli_help.py
          tests/test_desktop_command.py
          -q
      - name: Build native standalone package
        run: python packaging/build_desktop.py
      - name: Smoke-test frozen package and bundled resources
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || '' }}
          PYTHONUTF8: "1"
        run: python packaging/smoke_desktop.py
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: python packaging/build_windows_installer.py
      - name: Smoke-test Windows installer
        if: runner.os == 'Windows'
        run: python packaging/smoke_windows_installer.py
      - name: Collect Ubuntu sources for bundled system libraries
        if: runner.os == 'Linux' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        run: python packaging/collect_ubuntu_sources.py
      - name: Archive and hash package
        run: python packaging/archive_desktop.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: callimachus-${{ matrix.platform }}
          path: build/desktop/artifacts/*
          if-no-files-found: error
          retention-days: 14

  source-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify version-matched dependency source archives
        run: python packaging/assemble_sources.py build/source-audit

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: callimachus-*
          merge-multiple: true
          path: release
      - name: Include the corresponding project source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --output="release/Callimachus-source-${RELEASE_TAG}.tar.gz" HEAD
          sha256sum "release/Callimachus-source-${RELEASE_TAG}.tar.gz" > "release/Callimachus-source-${RELEASE_TAG}.tar.gz.sha256"
      - name: Include version-matched dependency sources
        run: python packaging/assemble_sources.py release
      - name: Require the Ubuntu source archive
        run: test -s release/Callimachus-linux-system-sources.tar.gz
      - name: Publish only after every native job passes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes
