name: Recovery regressions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  selected-recovery:
    name: Selected recovery focus (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 2022
            os: windows-2022
          - name: Ubuntu 22.04
            os: ubuntu-22.04
    env:
      CITATION_VERIFIER_LLM_BACKEND: dummy
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
      - name: Install recovery dependencies
        shell: bash
        run: |
          python packaging/bootstrap_pip.py
          python -m pip install --only-binary=:all: \
            -c packaging/release-constraints.txt \
            -r requirements.txt -r requirements-gui.txt \
            -r requirements-ocr.txt -r requirements-rag.txt \
            pytest pytest-subtests
      - name: Run retained bibliography parsing regressions
        run: python -m pytest tests/test_columnaware_biblio.py tests/test_parse_golden.py tests/test_parsing.py -q
      - name: Run retained recovery and resume regressions
        run: >-
          python -m pytest
          tests/test_recovery_regressions.py
          tests/test_pause_schema_recovery.py
          tests/test_tasks_skip_fetch.py
          tests/test_pipeline_parallel.py
          tests/test_source_identity_attestation_phase.py
          tests/infra/test_current_run_schema.py -q
      - name: Run retained CLI and configuration regressions
        run: python -m pytest tests/test_cli_help.py tests/test_infra.py tests/test_invocation.py -q
      - name: Run retained adjacent pipeline regressions
        run: >-
          python -m pytest
          tests/infra/integrity/test_admission.py
          tests/test_pipeline_end_to_end.py
          tests/test_run_report.py
          tests/test_db.py -q
