name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "Callimachus-2.0.0"]
  workflow_dispatch:
    inputs:
      native_macos_fixture:
        description: Run the selected native macOS Keychain fixture
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  selected-suite:
    name: Selected suite (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 2022
            os: windows-2022
          - name: Ubuntu 22.04
            os: ubuntu-22.04
    env:
      CITATION_VERIFIER_LLM_BACKEND: dummy
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
      - name: Install selected-suite dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: \
            -c packaging/release-constraints.txt \
            -r requirements.txt -r requirements-gui.txt \
            -r requirements-ocr.txt -r requirements-rag.txt \
            pytest pytest-subtests
      - name: Run the retained selected suite
        if: runner.os == 'Linux'
        run: python -m pytest tests -q
      - name: Run the retained selected suite
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force C:\cv-tmp | Out-Null
          $env:TEMP = 'C:\cv-tmp'
          $env:TMP = 'C:\cv-tmp'
          python -m pytest tests -q

  native-macos-fixture:
    if: github.event_name == 'workflow_dispatch' && inputs.native_macos_fixture
    name: Native macOS Keychain fixture
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CITATION_VERIFIER_LLM_BACKEND: dummy
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
      - name: Install native fixture dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: \
            -c packaging/release-constraints.txt \
            -r requirements.txt -r requirements-gui.txt pytest
      - name: Create an isolated synthetic Keychain
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/callimachus-native-fixture.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          if test -e "$keychain"; then security delete-keychain "$keychain"; fi
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "CALLIMACHUS_NATIVE_KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
      - name: Run the selected native macOS fixture
        env:
          CALLIMACHUS_RUN_NATIVE_KEYCHAIN_TESTS: "1"
        run: python -m pytest tests/test_macos_single_vault_native.py -q
      - name: Remove the synthetic Keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/callimachus-native-fixture.keychain-db"
          if test -e "$keychain"; then security delete-keychain "$keychain"; fi
